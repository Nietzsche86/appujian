name: Build Android APK (Local Server Edition)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v6

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: 4. Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 5. Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: E-UJIAN-MTS-RTH-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
