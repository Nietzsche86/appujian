name: Build Android APK (Local Server Edition)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: 4. Compile Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 5. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kiosk-Exam-Reader-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
