name: Publish Official Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Versi Rilis (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-read-only: false

      - name: 4. Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi di repository secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-key.jks

      - name: 5. Compile Signed Release APK
        env:
          KEYSTORE_FILE: app/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace --no-daemon

      - name: 6. Prepare Release Binary
        id: prep
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_OUTPUT"
          
          RELEASE_APK="app/build/outputs/apk/release/E-UJIAN-MTS-RTH-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          echo "APK_PATH=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: 7. Publish Official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.prep.outputs.RELEASE_TAG }}
          APK_PATH: ${{ steps.prep.outputs.APK_PATH }}
        run: |
          gh release create "$TAG" "$APK_PATH" \
            --title "Aplikasi Ujian MTS RTH $TAG (Official Release)" \
            --notes "### Aplikasi Ujian Kiosk Semi-Online MTS ROUDHOTUT THOWALIB $TAG

          **Paket Rilis Resmi:**
          - Berkas APK bertanda tangan digital resmi (*Signed Release APK*).
          - Mode Kiosk Kunci Layar Penuh (*LockTask Mode*).
          - Proteksi Anti-Curang Kriptografi AES-256-GCM.
          - Pemeriksaan Kesiapan Perangkat & Spesifikasi Siswa (Android min. 8 Oreo, RAM min. 2 GB).

          **Petunjuk Instalasi Siswa & Proktor:**
          1. Unduh berkas **E-UJIAN-MTS-RTH-${TAG}.apk** di bawah.
          2. Buka dan izinkan instalasi aplikasi jika diminta oleh sistem Android.
          3. Pastikan Mode Pesawat AKTIF dan Mode Suara Hening sebelum masuk ujian."

      - name: 8. Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: E-UJIAN-MTS-RTH-Official-Release
          path: ${{ steps.prep.outputs.APK_PATH }}
          retention-days: 30
